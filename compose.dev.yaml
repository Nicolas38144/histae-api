# Pile locale mono-machine. Ne pas superposer ce fichier à compose.production.yaml.
# Les plafonds mémoire sont des maximums, pas de la RAM réservée au démarrage.
x-infrastructure-logging: &infrastructure-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-development-service: &development-service
  image: histae-api:development
  build:
    context: .
    target: development
  # Nest doit pouvoir écrire sa compilation incrémentale en développement.
  read_only: false
  volumes:
    - ./src:/app/src
    - ./scripts:/app/scripts
    - ./db:/app/db:ro
  # Les adresses Docker remplacent les valeurs loopback du .env de l'hôte.
  environment: &development-environment
    ENV: development
    PORT: "8080"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_SSLMODE: disable
    REDIS_ADDR: redis:6379
    REDIS_TLS: "false"
    OBJECT_STORAGE_ENDPOINT: http://storage.histae.localhost:8333
    PHOTO_MODERATION_ENDPOINT: http://photo-moderation:8080
    METRICS_HOST: 0.0.0.0

services:
  # Source de vérité métier ; le volume survit à la recréation du conteneur.
  postgres:
    image: postgres:18.6-bookworm
    logging: *infrastructure-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-histae-dev}
      POSTGRES_USER: ${POSTGRES_USER:-histae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      # Disposition des données propre à PostgreSQL 18 dans l'image officielle.
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - histae-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m
    # /dev/shm : mémoire partagée dynamique, incluse dans le plafond total.
    shm_size: 256m
    pids_limit: 256
    # Budget local : 1 Gio ; les 7 Gio sont réservés à compose.production.yaml.
    # Cette limite Docker ne règle pas shared_buffers ni work_mem dans PostgreSQL.
    mem_limit: 1g
    cpus: 2.0
    networks:
      - backend

  # État éphémère : compteurs et Pub/Sub. Aucune donnée métier durable.
  redis:
    image: redis:7.4.2-alpine
    logging: *infrastructure-logging
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # Garder 64 Mio de marge dans le conteneur pour les buffers et le processus.
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      # Ne pas évincer silencieusement les compteurs de protection HTTP.
      - noeviction
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.5
    networks:
      - backend

  # S3 local pour les photos privées ; weed mini est réservé au développement.
  object-storage:
    image: chrislusf/seaweedfs:4.45
    logging: *infrastructure-logging
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-histae-dev}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-histae-dev-secret-change-me}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:-histae-photos}
    ports:
      - 127.0.0.1:8333:8333
    volumes:
      - histae-object-storage-data:/data
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8333/healthz]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    networks:
      backend:
        # Même nom dans Docker et le navigateur pour préserver les signatures S3.
        aliases:
          - storage.histae.localhost

  # Analyse locale sans état persistant ; un seul worker pour borner la RAM.
  photo-moderation:
    logging: *infrastructure-logging
    init: true
    build:
      context: ./services/photo-moderation
    environment:
      MODERATION_TOKEN: ${PHOTO_MODERATION_TOKEN:?Define PHOTO_MODERATION_TOKEN with at least 32 bytes}
    ports:
      - 127.0.0.1:8090:8080
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - backend

  # PostgreSQL sain -> migrations réussies -> API et outbox.
  migrate:
    <<: *development-service
    command:
      - /bin/sh
      - -ec
      - pnpm run db:migrate
    environment:
      <<: *development-environment
      MAINTENANCE_MODE: disabled
      METRICS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *development-service
    command: [pnpm, run, start:dev]
    environment:
      <<: *development-environment
      MAINTENANCE_MODE: disabled
    ports:
      - 127.0.0.1:${HISTAE_API_HOST_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      photo-moderation:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  outbox-worker:
    <<: *development-service
    command: [pnpm, run, outbox:work]
    environment:
      <<: *development-environment
      MAINTENANCE_MODE: worker
      METRICS_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      photo-moderation:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  maintenance:
    <<: *development-service
    command: [pnpm, run, maintenance:run]
    environment:
      <<: *development-environment
      MAINTENANCE_MODE: worker
      METRICS_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      photo-moderation:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  # Stockages persistants : down les conserve, down --volumes les efface.
  histae-postgres-data:
  histae-object-storage-data:
