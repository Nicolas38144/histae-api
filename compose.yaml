# Socle applicatif commun. Ajouter compose.dev.yaml OU compose.production.yaml.
name: histae-api

# Même image pour HTTP, migrations et workers ; secrets injectés à l'exécution.
x-runtime-service: &runtime-service
  image: ${HISTAE_API_IMAGE:-histae-api:local}
  env_file:
    - ${HISTAE_ENV_FILE:-.env}
  # Récolte les processus enfants et transmet les signaux d'arrêt.
  init: true
  user: "1000:1000"
  read_only: true
  # Seul espace temporaire inscriptible en production ; compte dans mem_limit.
  tmpfs:
    - /tmp:size=128m,noexec,nosuid,nodev,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  networks:
    - backend
  # Rotation en taille ; la rétention en jours relève de l'exploitation.
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  # Job ponctuel : une erreur de migration bloque le démarrage applicatif.
  migrate:
    <<: *runtime-service
    command:
      - /bin/sh
      - -ec
      - pnpm run container:db:migrate
    environment:
      MAINTENANCE_MODE: disabled
      METRICS_ENABLED: "false"
    restart: "no"
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0

  # HTTP uniquement ; maintenance et outbox s'exécutent dans leurs workers.
  api:
    <<: *runtime-service
    command: [pnpm, run, container:start]
    environment:
      PORT: "8080"
      MAINTENANCE_MODE: disabled
      METRICS_HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    # Visibles sur les réseaux Docker ; aucune publication hôte dans ce socle.
    expose:
      - "8080"
      - "9091"
    # Liveness du processus. /health/ready contrôle séparément les dépendances.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Boucle persistante de revendication/reprise des événements transactionnels.
  outbox-worker:
    <<: *runtime-service
    command: [pnpm, run, container:outbox:work]
    environment:
      MAINTENANCE_MODE: worker
      METRICS_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5

  # Passe ponctuelle, uniquement avec --profile jobs ; à planifier en production.
  maintenance:
    <<: *runtime-service
    profiles: [jobs]
    command: [pnpm, run, container:maintenance:run]
    environment:
      MAINTENANCE_MODE: worker
      METRICS_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0

networks:
  backend:
    name: ${HISTAE_BACKEND_NETWORK:-histae-backend}
